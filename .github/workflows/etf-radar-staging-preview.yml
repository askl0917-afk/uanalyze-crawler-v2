name: ETF Radar Staging Preview

on:
  push:
    branches: [etf-radar-staging]
    paths:
      - 'etf-radar-staging/**'
      - '.github/workflows/etf-radar-staging-preview.yml'

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: etf-radar-staging
      - name: Build single-file preview
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('etf-radar-staging')
          html = (root/'index.html').read_text(encoding='utf-8')
          css = (root/'style.css').read_text(encoding='utf-8')
          js = (root/'app.js').read_text(encoding='utf-8')
          html = html.replace('<link rel="stylesheet" href="style.css">', '<style>\n'+css+'\n</style>')
          html = html.replace('<script src="app.js"></script>', '<script>\n'+js+'\n</script>')
          (root/'preview.html').write_text(html, encoding='utf-8')
          PY
      - name: Commit preview
        run: |
          if git diff --quiet -- etf-radar-staging/preview.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add etf-radar-staging/preview.html
          git commit -m 'Build ETF radar single-file staging preview'
          git push origin HEAD:etf-radar-staging
