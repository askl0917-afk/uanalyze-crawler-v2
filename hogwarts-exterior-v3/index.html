const views=[{name:'湖面正面',desc:'主視角先看黑湖、Great Hall、主塔群、懸崖與拱橋的整體輪廓是否成立。',p:[46,28,60],t:[0,10.5,0]},{name:'高地背面',desc:'背面檢查：是否仍有完整量體，而不是只做正面。',p:[-50,31,-50],t:[1,10,0]},{name:'左側',desc:'左側檢查 Great Hall 長向立面、扶壁節奏與塔群前後關係。',p:[-63,22,14],t:[-1,10,0]},{name:'右側',desc:'右側檢查天文塔、方塔與溫室是否有合理比例。',p:[61,24,-19],t:[2,10,0]},{name:'俯視',desc:'俯視檢查平面布局、庭院、橋梁與溫室位置。',p:[.1,76,.1],t:[0,6,0]}];
const viewsEl=document.getElementById('views'),viewName=document.getElementById('viewName'),viewDesc=document.getElementById('viewDesc');let vi=0,isNight=true,uiShown=true;views.forEach((v,i)=>{const b=document.createElement('button');b.className='view';b.textContent=v.name;b.onclick=()=>go(i);viewsEl.appendChild(b)});function go(i){vi=i;const v=views[i];camera.position.set(...v.p);controls.target.set(...v.t);controls.update();viewName.textContent=v.name;viewDesc.textContent=v.desc;[...viewsEl.children].forEach((b,j)=>b.classList.toggle('on',j===i))}go(0);function zoom(f){const d=camera.position.clone().sub(controls.target).multiplyScalar(f);camera.position.copy(controls.target).add(d);controls.update()}
document.getElementById('zin').onclick=()=>zoom(.82);document.getElementById('zout').onclick=()=>zoom(1.22);document.getElementById('next').onclick=()=>go((vi+1)%views.length);document.getElementById('reset').onclick=()=>go(0);const auto=document.getElementById('auto');auto.onclick=()=>{controls.autoRotate=!controls.autoRotate;controls.autoRotateSpeed=.42;auto.classList.toggle('on',controls.autoRotate)};const dayBtn=document.getElementById('day');const modeTxt=document.getElementById('modeTxt');dayBtn.onclick=()=>{isNight=!isNight;dayBtn.classList.toggle('on',isNight);modeTxt.textContent=isNight?'夜景':'薄暮';scene.background.setHex(isNight?0x0d1930:0x91a4b7);scene.fog.color.setHex(isNight?0x10203a:0x92a5b7);renderer.toneMappingExposure=isNight?1.26:1.42;moon.intensity=isNight?3.35:1.4;warm.intensity=isNight?1.05:1.95;fill.intensity=isNight?1.4:1.08;hemi.intensity=isNight?1.95:2.45;m.win.emissiveIntensity=isNight?1.05:.45;stars.visible=isNight;moonDisk.visible=isNight};document.getElementById('ui').onclick=()=>{uiShown=!uiShown;document.getElementById('title').style.display=uiShown?'block':'none';document.getElementById('viewInfo').style.display=uiShown?'block':'none';viewsEl.style.display=uiShown?'flex':'none';document.getElementById('legend').style.display=uiShown?'block':'none';document.getElementById('hint').style.display=uiShown?'block':'none'};
document.getElementById('count').textContent=count.toLocaleString();function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize,{passive:true});resize();loading.style.display='none';const clock=new THREE.Clock();const wp=waterG.attributes.position;function loop(){const t=clock.getElapsedTime();for(let i=0;i<wp.count;i++){const x=wp.getX(i),z=wp.getZ(i);wp.setY(i,waterBase[i*3+1]+Math.sin(x*.12+t*.45)*.12+Math.cos(z*.1-t*.38)*.08)}wp.needsUpdate=true;for(const o of birds){o.b.position.x+=o.s;if(o.b.position.x>38)o.b.position.x=-38;o.b.position.y+=Math.sin(t*2+o.ph)*.004;o.b.rotation.y=.22*Math.sin(t*.45+o.ph)}controls.update();renderer.render(scene,camera);requestAnimationFrame(loop)}loop();
}catch(err){console.error(err);loading.style.display='none';errorBox.style.display='flex'}
