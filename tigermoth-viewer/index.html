<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Tigermoth 互動 3D 模型</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a20; --text:#f4f5f7; --muted:#aeb4bf;
    --line:#2a2f38; --accent:#d5ad55;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{min-height:100vh;overflow:hidden}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #viewer{flex:1;min-height:0;position:relative;touch-action:none}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .topbar{
    position:absolute;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));
    z-index:3;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    pointer-events:none;
  }
  .badge,.help{
    background:rgba(18,20,25,.78);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;
    box-shadow:0 6px 20px rgba(0,0,0,.2)
  }
  .badge{font-size:14px;font-weight:700}
  .badge small{display:block;color:var(--muted);font-weight:500;margin-top:3px}
  .help{font-size:12px;color:var(--muted);text-align:right}
  .toolbar{
    position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));
    z-index:4;display:flex;gap:8px;overflow-x:auto;padding:8px;
    background:rgba(18,20,25,.84);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.12);border-radius:14px;
    -webkit-overflow-scrolling:touch;
  }
  button{
    flex:0 0 auto;appearance:none;border:1px solid rgba(255,255,255,.14);
    color:var(--text);background:#20242c;border-radius:10px;padding:10px 12px;
    font-size:14px;font-weight:650;min-height:42px;
  }
  button:active{transform:scale(.98)}
  button.primary{border-color:#7d6633;background:#3a2f17;color:#f6e8bd}
  #loading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);z-index:8;color:var(--muted);font-size:14px
  }
  #error{
    display:none;position:absolute;inset:20px;z-index:10;align-items:center;justify-content:center;
    text-align:center;background:#171a20;border:1px solid #343a45;border-radius:14px;padding:20px
  }
  #error b{display:block;color:#fff;margin-bottom:8px}
</style>
</head>
<body>
<div id="app">
  <div id="viewer">
    <div id="loading">正在載入 3D 模型…</div>
    <div id="error"><div><b>3D 載入失敗</b>請確認 Safari 有網路連線後重新整理；此頁會從 CDN 載入 Three.js。</div></div>

    <div class="topbar">
      <div class="badge">Tigermoth 互動 3D
        <small>概念重建版｜依你提供的商品圖＋六視圖重建</small>
      </div>
      <div class="help">單指：旋轉<br>雙指：縮放／平移</div>
    </div>

    <div class="toolbar">
      <button class="primary" data-view="iso">斜角</button>
      <button data-view="front">正面</button>
      <button data-view="back">背面</button>
      <button data-view="left">左側</button>
      <button data-view="right">右側</button>
      <button data-view="top">俯視</button>
      <button id="auto">自動旋轉</button>
      <button id="reset">重設</button>
    </div>
  </div>
</div>

<script type="module">
(async()=>{
  const loading=document.getElementById('loading');
  const errorBox=document.getElementById('error');
  try{
    const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/+esm');
    const {OrbitControls} = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js/+esm');

    const viewer=document.getElementById('viewer');
    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0x0f1115);

    const camera=new THREE.PerspectiveCamera(36,1,0.1,100);
    camera.position.set(8.6,4.8,9.5);

    const renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    viewer.prepend(renderer.domElement);

    const controls=new OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true;
    controls.dampingFactor=.06;
    controls.enablePan=true;
    controls.minDistance=5.2;
    controls.maxDistance=24;
    controls.target.set(0,-0.05,0);

    scene.add(new THREE.HemisphereLight(0xfff7e8,0x27303d,2.5));
    const key=new THREE.DirectionalLight(0xfff1c9,4.2);
    key.position.set(6,8,5); key.castShadow=true; scene.add(key);
    const rim=new THREE.DirectionalLight(0xbfd7ff,1.8);
    rim.position.set(-5,3,-6); scene.add(rim);

    const brass=new THREE.MeshStandardMaterial({color:0xb28a3f,metalness:.72,roughness:.34});
    const brassDark=new THREE.MeshStandardMaterial({color:0x6d542a,metalness:.7,roughness:.4});
    const steel=new THREE.MeshStandardMaterial({color:0x8b8e91,metalness:.78,roughness:.3});
    const wood=new THREE.MeshStandardMaterial({color:0x7b5b2d,metalness:.1,roughness:.6});
    const glass=new THREE.MeshPhysicalMaterial({color:0x9ac7cf,metalness:0,roughness:.12,transmission:.5,transparent:true,opacity:.4});
    const wireMat=new THREE.MeshStandardMaterial({color:0xc39d55,metalness:.72,roughness:.3});
    const lineMat=new THREE.LineBasicMaterial({color:0xc5a25d,transparent:true,opacity:.8});

    const craft=new THREE.Group();
    scene.add(craft);

    function cyl(a,b,r,mat=wireMat){
      const v=new THREE.Vector3().subVectors(b,a);
      const len=v.length();
      const g=new THREE.CylinderGeometry(r,r,len,8);
      const m=new THREE.Mesh(g,mat);
      m.position.copy(a).add(b).multiplyScalar(.5);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.clone().normalize());
      m.castShadow=true;
      craft.add(m);
      return m;
    }
    function box(size,pos,mat=brass,rot=[0,0,0]){
      const m=new THREE.Mesh(new THREE.BoxGeometry(...size),mat);
      m.position.set(...pos); m.rotation.set(...rot); m.castShadow=true; craft.add(m); return m;
    }
    function sphere(scale,pos,mat=brass){
      const m=new THREE.Mesh(new THREE.SphereGeometry(1,28,18),mat);
      m.scale.set(...scale); m.position.set(...pos); m.castShadow=true; craft.add(m); return m;
    }

    const hullCenterY=.65, hullLen=5.8, hullRY=1.45, hullRZ=1.3;
    const xs=[-2.55,-2.05,-1.45,-.8,0,.8,1.55,2.2,2.65];
    xs.forEach(x=>{
      const s=Math.sqrt(Math.max(.12,1-(x/(hullLen/2))**2));
      const ry=hullRY*s, rz=hullRZ*s;
      const pts=[];
      for(let i=0;i<=64;i++){
        const a=i/64*Math.PI*2;
        pts.push(new THREE.Vector3(x,hullCenterY+ry*Math.cos(a),rz*Math.sin(a)));
      }
      const geo=new THREE.BufferGeometry().setFromPoints(pts);
      craft.add(new THREE.Line(geo,lineMat));
    });

    for(let k=0;k<12;k++){
      const a=k/12*Math.PI*2;
      const pts=[];
      for(let i=0;i<=64;i++){
        const x=-hullLen/2+i/64*hullLen;
        const s=Math.sqrt(Math.max(0,1-(x/(hullLen/2))**2));
        pts.push(new THREE.Vector3(x,hullCenterY+hullRY*s*Math.cos(a),hullRZ*s*Math.sin(a)));
      }
      craft.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lineMat));
    }

    cyl(new THREE.Vector3(-2.7,hullCenterY,0),new THREE.Vector3(2.75,hullCenterY,0),.035);
    xs.slice(1,-1).forEach(x=>{
      const s=Math.sqrt(Math.max(.12,1-(x/(hullLen/2))**2));
      const ry=hullRY*s, rz=hullRZ*s;
      cyl(new THREE.Vector3(x,hullCenterY,0),new THREE.Vector3(x,hullCenterY+ry,0),.018);
      cyl(new THREE.Vector3(x,hullCenterY,0),new THREE.Vector3(x,hullCenterY,rz),.018);
      cyl(new THREE.Vector3(x,hullCenterY,0),new THREE.Vector3(x,hullCenterY,-rz),.018);
    });

    sphere([1.7,.48,.68],[-.25,-.82,0],brassDark);
    box([2.75,.45,1.05],[-.3,-.72,0],brass);
    for(let i=-1;i<=1;i++){
      box([.38,.28,.03],[-.65+i*.62,-.64,.535],glass);
      box([.38,.28,.03],[-.65+i*.62,-.64,-.535],glass);
    }
    box([1.7,.12,.92],[-.3,-1.05,0],wood);
    [-1.3,-.45,.45,1.25].forEach(x=>{
      cyl(new THREE.Vector3(x,-.45,.48),new THREE.Vector3(x,.15,.72),.025);
      cyl(new THREE.Vector3(x,-.45,-.48),new THREE.Vector3(x,.15,-.72),.025);
    });

    function wing(zSign){
      cyl(new THREE.Vector3(-.6,-.62,.52*zSign),new THREE.Vector3(-1.1,-.68,2.55*zSign),.035);
      cyl(new THREE.Vector3(.4,-.62,.52*zSign),new THREE.Vector3(.15,-.72,2.45*zSign),.035);
      cyl(new THREE.Vector3(-1.1,-.68,2.55*zSign),new THREE.Vector3(.15,-.72,2.45*zSign),.025);
      for(let t=0;t<=4;t++){
        const zz=(.6+t*.45)*zSign;
        cyl(new THREE.Vector3(-.75,-.64,zz),new THREE.Vector3(.25,-.69,zz),.012);
      }
      sphere([.34,.34,.34],[-.5,-.7,2.9*zSign],brass);
      cyl(new THREE.Vector3(-.5,-.7,2.88*zSign),new THREE.Vector3(-.5,-.7,3.18*zSign),.05,steel);
      const pg=new THREE.Group(); pg.position.set(-.5,-.7,3.22*zSign); pg.rotation.x=Math.PI/2; craft.add(pg);
      for(let i=0;i<3;i++){
        const blade=new THREE.Mesh(new THREE.BoxGeometry(.11,1.25,.12),wood);
        blade.position.y=.52; blade.rotation.z=i*Math.PI*2/3; pg.add(blade);
      }
    }
    wing(1); wing(-1);

    sphere([.22,.22,.22],[.15,-1.42,0],brass);
    const pbg=new THREE.Group(); pbg.position.set(.15,-1.58,0); craft.add(pbg);
    for(let i=0;i<3;i++){
      const b=new THREE.Mesh(new THREE.BoxGeometry(.09,.85,.13),wood);
      b.position.y=.36; b.rotation.z=i*Math.PI*2/3; pbg.add(b);
    }

    cyl(new THREE.Vector3(2.35,.45,0),new THREE.Vector3(4.1,.46,0),.045);
    cyl(new THREE.Vector3(2.25,.7,.38),new THREE.Vector3(4.05,.72,.25),.022);
    cyl(new THREE.Vector3(2.25,.7,-.38),new THREE.Vector3(4.05,.72,-.25),.022);

    [3.55,4.05].forEach((x,idx)=>{
      const r=.78-idx*.1;
      const pts=[];
      for(let i=0;i<=48;i++){
        const a=i/48*Math.PI*2;
        pts.push(new THREE.Vector3(x,.55+r*Math.cos(a),r*.7*Math.sin(a)));
      }
      craft.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lineMat));
    });
    box([1.2,.06,1.75],[3.65,.55,0],brassDark);
    box([1.2,1.55,.06],[3.65,.55,0],brassDark);

    box([1.6,.06,.06],[1.05,2.15,0],wireMat);
    cyl(new THREE.Vector3(.3,1.55,0),new THREE.Vector3(.3,2.15,0),.025);
    cyl(new THREE.Vector3(1.8,1.25,0),new THREE.Vector3(1.8,2.15,0),.025);
    cyl(new THREE.Vector3(.3,2.15,0),new THREE.Vector3(1.8,1.25,0),.018);

    cyl(new THREE.Vector3(-2.65,.65,.4),new THREE.Vector3(-3.05,.4,.72),.022);
    cyl(new THREE.Vector3(-2.65,.65,-.4),new THREE.Vector3(-3.05,.4,-.72),.022);

    cyl(new THREE.Vector3(-1.3,-1.2,.6),new THREE.Vector3(1.1,-1.2,.6),.028,steel);
    cyl(new THREE.Vector3(-1.3,-1.2,-.6),new THREE.Vector3(1.1,-1.2,-.6),.028,steel);

    const ground=new THREE.Mesh(new THREE.CircleGeometry(12,64),new THREE.MeshStandardMaterial({color:0x15181d,roughness:1}));
    ground.rotation.x=-Math.PI/2; ground.position.y=-1.72; ground.receiveShadow=true; scene.add(ground);
    const grid=new THREE.GridHelper(18,18,0x3a414d,0x262b33); grid.position.y=-1.71; scene.add(grid);

    function resize(){
      const w=viewer.clientWidth, h=viewer.clientHeight;
      renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
    }
    window.addEventListener('resize',resize,{passive:true}); resize();

    function look(pos){ camera.position.set(...pos); controls.target.set(0,-.05,0); controls.update(); }
    const views={iso:[8.6,4.8,9.5],front:[-10,0.2,0],back:[10,0.2,0],left:[0,0.2,10],right:[0,0.2,-10],top:[0,12,.01]};
    document.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>look(views[btn.dataset.view])));
    document.getElementById('reset').addEventListener('click',()=>{controls.autoRotate=false;document.getElementById('auto').textContent='自動旋轉';look(views.iso)});
    const auto=document.getElementById('auto');
    auto.addEventListener('click',()=>{ controls.autoRotate=!controls.autoRotate; controls.autoRotateSpeed=1.2; auto.textContent=controls.autoRotate?'停止旋轉':'自動旋轉'; });

    loading.style.display='none';
    let last=performance.now();
    function render(now){ const dt=Math.min(.05,(now-last)/1000); last=now; controls.update(dt); renderer.render(scene,camera); requestAnimationFrame(render); }
    requestAnimationFrame(render);

  }catch(err){
    console.error(err); loading.style.display='none'; errorBox.style.display='flex';
  }
})();
</script>
</body>
</html>
