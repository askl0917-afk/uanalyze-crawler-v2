<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ETF Radar Staging</title><style>*{box-sizing:border-box}html,body{margin:0;background:#111317;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}body{overflow-x:hidden}.top{position:sticky;top:0;z-index:20;background:#15181c;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;border-bottom:1px solid #333}.brand{font-weight:900}.tabs,.pager{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px}.tabs button,.pager button,.close{border:0;border-radius:10px;background:#2c3036;color:#fff;padding:10px 5px;font-weight:800}.tabs .active{background:#555b63}.page{padding:8px 8px 80px}.status{border:1px solid #8a6727;background:#2c240b;color:#f3cf72;padding:9px;border-radius:9px;font-size:12px}.card{background:#1d2025;border:1px solid #343940;border-radius:12px;margin-top:8px;overflow:hidden}.title{padding:12px;font-size:20px;font-weight:900}.dates,.row{display:grid;grid-template-columns:74px repeat(5,minmax(0,1fr));}.dates div{background:#e8eef3;color:#123f70;font-size:9px;font-weight:900;padding:7px 2px;text-align:center}.row div{border-bottom:1px solid #353a40;min-height:47px;padding:6px 2px;font-size:7px;display:flex;align-items:center;justify-content:center;text-align:center}.row .name{font-size:9px;font-weight:900;justify-content:flex-start;padding-left:6px}.buy{color:#ef6464}.sell{color:#40b58d}.missing{color:#e0ad42}.modal{display:none;position:fixed;inset:0;background:#111317;z-index:99;flex-direction:column}.modal.open{display:flex}.modalhead{flex:none;background:#171a1e;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;border-bottom:1px solid #333}.modalrow{display:flex;justify-content:space-between;align-items:center}.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 8px calc(30px + env(safe-area-inset-bottom))}.metric{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.metric div{background:#292d32;border-radius:9px;text-align:center;padding:8px 2px;font-size:10px}.spacer{height:500px;display:flex;align-items:flex-end;justify-content:center;color:#777;padding-bottom:20px}.hidden{display:none}</style></head><body><header class="top"><div class="brand">虎八 ETF 研究室｜STAGING</div><div class="tabs"><button class="active" onclick="page('report',this)">報表</button><button onclick="page('etf',this)">ETF 總覽</button><button onclick="openRadar()">個股雷達</button></div></header><main><section id="report" class="page"><div class="status"><b>持股資料最新日：2026-08-28</b><br>8/31 尚未取得持股資料，因此不顯示 8/31。</div><div class="card"><div class="title">8/28 主動式 ETF｜五日持股異動</div><div class="dates"><div>ETF</div><div>8/24</div><div>8/25</div><div>8/26</div><div>8/27</div><div>8/28</div></div><div id="reportRows"></div></div></section><section id="etf" class="page hidden"><div class="card"><div class="title"><span id="ecode"></span><br><small id="ename" style="font-size:12px;color:#aaa"></small><div class="pager"><button onclick="stepETF(-1)">‹ 上一檔</button><span id="epos" style="text-align:center;padding:10px"></span><button onclick="stepETF(1)">下一檔 ›</button></div></div><div class="dates"><div>標的</div><div>8/24</div><div>8/25</div><div>8/26</div><div>8/27</div><div>8/28</div></div><div id="erows"></div></div></section></main><div id="radar" class="modal"><div class="modalhead"><div class="modalrow"><button class="close" onclick="closeRadar()">‹ 關閉</button><b>個股 ETF 雷達</b><span></span></div><div class="pager"><button onclick="stepStock(-1)">‹ 上一檔</button><span id="spos" style="text-align:center;padding:10px"></span><button onclick="stepStock(1)">下一檔 ›</button></div></div><div class="scroll"><div class="title" id="stitle"></div><div class="metric"><div>買進<br><b class="buy">8.17億</b></div><div>賣出<br><b class="sell">49.04億</b></div><div>淨額<br><b class="sell">-40.87億</b></div><div>異動ETF<br><b>6檔</b></div></div><div class="card"><div class="dates"><div>ETF</div><div>8/24</div><div>8/25</div><div>8/26</div><div>8/27</div><div>8/28</div></div><div id="rrows"></div></div><div class="spacer">可完整滑動至頁面底部</div></div></div><script>const D=['8/24','8/25','8/26','8/27','8/28'];const E=[['00981A','主動統一台股增長'],['00403A','主動統一升級50'],['00991A','主動復華未來50'],['00982A','主動群益台灣強棒'],['00980A','主動野村臺灣優選']];const S=['台積電 2330','信驊 5274','大立光 3008','旺矽 6223','萬潤 6187'];let ei=0,si=0;function cells(seed){return D.map((d,j)=>j===4?'<div class="missing">缺</div>':((seed+j)%4===0?'<div>—</div>':`<div class="${(seed+j)%2?'buy':'sell'}">${(seed+j)%2?'+':'-'}${(.5+seed*.2+j*.3).toFixed(2)}億<br>${20+seed*10+j*7}張</div>`)).join('')}function report(){reportRows.innerHTML=E.slice(0,3).map((e,i)=>`<div class="row"><div class="name">${e[0]}</div>${cells(i)}</div>`).join('')}function renderETF(){ecode.textContent=E[ei][0];ename.textContent=E[ei][1];epos.textContent=`${ei+1}/${E.length}`;erows.innerHTML=S.concat(['聯亞','高力','奇鋐','群聯']).map((s,i)=>`<div class="row"><div class="name">${s}</div>${cells(i+ei)}</div>`).join('')}function renderRadar(){stitle.textContent=S[si];spos.textContent=`${si+1}/${S.length}`;rrows.innerHTML=E.concat([['00984A','主動安聯台灣高息'],['00985A','主動野村臺灣50'],['00986A','主動台新龍頭']]).map((e,i)=>`<div class="row"><div class="name">${e[0]}</div>${cells(i+si)}</div>`).join('')}function page(id,b){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='etf')renderETF()}function stepETF(n){ei=Math.max(0,Math.min(E.length-1,ei+n));renderETF()}function openRadar(){radar.classList.add('open');document.body.style.overflow='hidden';renderRadar()}function closeRadar(){radar.classList.remove('open');document.body.style.overflow=''}function stepStock(n){si=Math.max(0,Math.min(S.length-1,si+n));renderRadar()}report();renderETF();</script></body></html>
